name: Auto-translate README to English

on:
  push:
    branches: [ main, feat/* ]
    paths:
      - 'README.md'
  pull_request:
    branches: [ main ]
    paths:
      - 'README.md'
  workflow_dispatch: # Manueller Trigger

jobs:
  translate-readme:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Install dependencies
      run: |
        npm install axios

    - name: Create translation script
      run: |
        cat > translate.js << 'EOF'
        const fs = require('fs');
        const path = require('path');
        const axios = require('axios');

        // Sichere Arbeitsverzeichnis-Behandlung
        function getWorkingDirectory() {
          try {
            // Versuche verschiedene Verzeichnisse
            const possiblePaths = [
              process.env.GITHUB_WORKSPACE,
              process.cwd(),
              __dirname,
              '.'
            ].filter(Boolean);
            
            for (const dir of possiblePaths) {
              try {
                if (fs.existsSync(path.join(dir, 'README.md'))) {
                  console.log('✅ README.md gefunden in:', dir);
                  return dir;
                }
              } catch (e) {
                console.log('⚠️ Verzeichnis nicht zugänglich:', dir);
              }
            }
            
            throw new Error('Kein gültiges Arbeitsverzeichnis mit README.md gefunden');
          } catch (error) {
            console.error('❌ Fehler beim Bestimmen des Arbeitsverzeichnisses:', error.message);
            throw error;
          }
        }

        // Übersetzungsfunktion mit mehreren API-Optionen
        async function translateText(text, targetLang = 'en') {
          let lastError = null;
          
          try {
            // Versuche LibreTranslate API (kostenlos)
            console.log('🔄 Versuche LibreTranslate API...');
            const response = await axios.post('https://libretranslate.de/translate', {
              q: text,
              source: 'de',
              target: targetLang,
              format: 'text'
            }, {
              timeout: 15000 // 15 Sekunden Timeout
            });
            
            if (response.data && response.data.translatedText) {
              console.log('✅ LibreTranslate erfolgreich');
              return response.data.translatedText;
            }
          } catch (error) {
            lastError = error;
            console.log('❌ LibreTranslate fehlgeschlagen:', error.message);
          }

          try {
            // Versuche MyMemory API (kostenlos, 1000 Anfragen/Tag)
            console.log('🔄 Versuche MyMemory API...');
            const encodedText = encodeURIComponent(text);
            const response = await axios.get(
              `https://api.mymemory.translated.net/get?q=${encodedText}&langpair=de|en`,
              { timeout: 15000 }
            );
            
            if (response.data && response.data.responseData && response.data.responseData.translatedText) {
              console.log('✅ MyMemory erfolgreich');
              return response.data.responseData.translatedText;
            }
          } catch (error) {
            lastError = error;
            console.log('❌ MyMemory fehlgeschlagen:', error.message);
          }

          // Alle APIs sind fehlgeschlagen
          const errorMessage = `Alle Übersetzungs-APIs sind fehlgeschlagen:
          - LibreTranslate: ${lastError?.message || 'Unbekannter Fehler'}
          - MyMemory: ${lastError?.message || 'Unbekannter Fehler'}
          
          Bitte überprüfen Sie die API-Verfügbarkeit oder verwenden Sie eine andere Übersetzungsmethode.`;
          
          throw new Error(errorMessage);
        }

        async function translateMarkdown() {
          try {
            // Bestimme sicheres Arbeitsverzeichnis
            const workingDir = getWorkingDirectory();
            console.log('📁 Verwende Arbeitsverzeichnis:', workingDir);
            
            // Lese deutsche README
            const readmePath = path.join(workingDir, 'README.md');
            console.log('🔍 Lese README.md von:', readmePath);
            
            const germanReadme = fs.readFileSync(readmePath, 'utf8');
            console.log('📖 Deutsche README gelesen');
            console.log('📝 Länge des Textes:', germanReadme.length, 'Zeichen');
            
            // Übersetze den Inhalt
            const translatedContent = await translateText(germanReadme);
            
            // Erstelle englische README
            const englishReadme = '# Kitadachs\n\n' + translatedContent + '\n\n---\n*This README was automatically translated from German using GitHub Actions.*\n*Die deutsche Version finden Sie in der [README.md](README.md) Datei.*';

            // Schreibe englische README
            const outputPath = path.join(workingDir, 'README.en.md');
            fs.writeFileSync(outputPath, englishReadme);
            console.log('✅ README.en.md erfolgreich erstellt in:', outputPath);
            
            // Prüfe ob es Änderungen gibt
            const existingEnglish = fs.existsSync(outputPath) ? fs.readFileSync(outputPath, 'utf8') : '';
            if (existingEnglish !== englishReadme) {
              console.log('🔄 Neue Übersetzung erstellt');
              return true; // Änderungen vorhanden
            } else {
              console.log('ℹ️ Keine Änderungen notwendig');
              return false; // Keine Änderungen
            }
            
          } catch (error) {
            console.error('❌ Fehler beim Übersetzen:', error.message);
            throw error; // Fehler weiterwerfen für GitHub-Benachrichtigung
          }
        }

        // Hauptfunktion mit Fehlerbehandlung
        async function main() {
          try {
            console.log('🚀 Starte Übersetzungsprozess...');
            const hasChanges = await translateMarkdown();
            console.log('🎯 Übersetzung abgeschlossen, Änderungen:', hasChanges);
            process.exit(hasChanges ? 0 : 1);
          } catch (error) {
            console.error('❌ Kritischer Fehler:', error.message);
            process.exit(1);
          }
        }

        // Führe Hauptfunktion aus
        main();
        EOF

    - name: Run translation
      id: translation
      run: |
        echo "🚀 Starte Übersetzung..."
        echo "📁 Aktuelles Verzeichnis: $(pwd)"
        echo "📁 Verfügbare Dateien: $(ls -la)"
        echo "📁 GITHUB_WORKSPACE: $GITHUB_WORKSPACE"
        
        # Führe Node.js Script aus
        if node translate.js; then
          echo "translation-success=true" >> $GITHUB_OUTPUT
          echo "✅ Übersetzung erfolgreich"
        else
          echo "translation-success=false" >> $GITHUB_OUTPUT
          echo "❌ Übersetzung fehlgeschlagen"
          exit 1  # Wichtig: Exit Code 1 bei Fehler
        fi

    - name: Check for changes
      id: check-changes
      if: steps.translation.outputs.translation-success == 'true'
      run: |
        if git diff --quiet README.en.md; then
          echo "has-changes=false" >> $GITHUB_OUTPUT
          echo "ℹ️ Keine Änderungen an README.en.md"
        else
          echo "has-changes=true" >> $GITHUB_OUTPUT
          echo "🔄 Änderungen an README.en.md erkannt"
        fi

    - name: Commit and push changes
      if: steps.translation.outputs.translation-success == 'true' && steps.check-changes.outputs.has-changes == 'true'
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add README.en.md
        git commit -m "🌍 Auto-translate README to English - Automatically translated from German README - Updated by GitHub Actions workflow - Translation using LibreTranslate/MyMemory APIs"
        git push

    - name: Create Pull Request for translation
      if: steps.translation.outputs.translation-success == 'true' && steps.check-changes.outputs.has-changes == 'true'
      uses: peter-evans/create-pull-request@v5
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        commit-message: "🌍 Auto-translate README to English"
        title: "🌍 Auto-translate README to English"
        body: "## 🤖 Automatische Übersetzung der README\n\nDiese Pull Request wurde automatisch von GitHub Actions erstellt.\n\n### Was wurde gemacht:\n- 📖 Deutsche README ins Englische übersetzt\n- 🔄 Übersetzung bei jeder Änderung der deutschen Version aktualisiert\n- ✅ Übersetzung über LibreTranslate oder MyMemory API\n- 🌐 Robuste Übersetzungslogik implementiert\n\n### Dateien:\n- `README.md` - Deutsche Version (Original)\n- `README.en.md` - Englische Version (Übersetzung)\n\n### Übersetzungs-APIs (in Reihenfolge):\n1. **LibreTranslate** - Kostenlose Open-Source API\n2. **MyMemory** - Kostenlose API (1000 Anfragen/Tag)\n\n### Hinweise:\n- Die Übersetzung erfolgt automatisch bei jedem Push auf main/master\n- Beide APIs werden versucht, bevor ein Fehler gemeldet wird\n- Beide Versionen werden synchron gehalten\n- Übersetzungen werden nur bei Änderungen erstellt\n\n---\n*Diese PR wurde automatisch generiert. Bitte überprüfen Sie die Übersetzung.*"
        branch: auto-translate-readme
        delete-branch: true
        labels: "translation,automated,documentation"

    - name: Translation Summary
      if: always()
      run: |
        echo "## 🌍 Übersetzungs-Zusammenfassung" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        if [ "${{ steps.translation.outputs.translation-success }}" == "true" ]; then
          echo "✅ **Übersetzung erfolgreich**" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.check-changes.outputs.has-changes }}" == "true" ]; then
            echo "🔄 **Neue Übersetzung erstellt**" >> $GITHUB_STEP_SUMMARY
            echo "- README.en.md wurde aktualisiert" >> $GITHUB_STEP_SUMMARY
            echo "- Pull Request wurde erstellt" >> $GITHUB_STEP_SUMMARY
          else
            echo "ℹ️ **Keine Änderungen notwendig**" >> $GITHUB_STEP_SUMMARY
          fi
        else
          echo "❌ **Übersetzung fehlgeschlagen**" >> $GITHUB_STEP_SUMMARY
          echo "- GitHub wird automatisch eine E-Mail-Benachrichtigung senden" >> $GITHUB_STEP_SUMMARY
          echo "- Überprüfen Sie die Logs für Details" >> $GITHUB_STEP_SUMMARY
          echo "- Beide Übersetzungs-APIs sind nicht verfügbar" >> $GITHUB_STEP_SUMMARY
        fi
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "---" >> $GITHUB_STEP_SUMMARY
        echo "*Workflow: Auto-translate README to English*" >> $GITHUB_STEP_SUMMARY

